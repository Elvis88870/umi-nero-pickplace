# Existing dual-camera entry point; defaults remain backward compatible.
defaults:
  - pika_nero_pick_place_base
  - _self_

task:
  shape_meta:
    obs:
      camera1_rgb:
        shape: [3, 224, 224]
        horizon: ${task.img_obs_horizon}
        latency_steps: 0
        down_sample_steps: ${task.obs_down_sample_steps}
        type: rgb
        ignore_by_policy: false
  dataset:
    quality_filter:
      camera_masks:
        camera1_rgb: d405_valid
