# Shared timing, state, quality filtering and optimization for Pika/NERO.
# Camera-specific entry configs inherit this file.

defaults:
  - train_diffusion_unet_timm_umi_workspace
  - _self_

name: pika_nero_pick_place_diffusion_unet_timm
task_name: pika_nero_pick_place

task:
  name: pika_nero_pick_place
  # The launchers export this value. It may also be overridden on the CLI.
  dataset_path: ${oc.env:NERO_PICK_PLACE_DATASET_PATH}

  # Source Zarr is stored at ~30 Hz. A stride of 3 gives 10 Hz model windows.
  dataset_frequeny: 30.0
  obs_down_sample_steps: 3
  low_dim_obs_horizon: 2
  img_obs_horizon: 2
  action_horizon: 16

  # Baseline: timestamps are synchronized, but physical latency is uncalibrated.
  # Do not copy the original GoPro values from task/umi.yaml.
  camera_obs_latency: 0.0
  robot_obs_latency: 0.0
  gripper_obs_latency: 0.0

  # Make the representation contract explicit instead of relying only on the
  # inherited UMI defaults. This is required for the session-dependent
  # pika_world origin to cancel in single-arm samples.
  pose_repr:
    obs_pose_repr: relative
    action_pose_repr: relative
  dataset:
    shape_meta: ${task.shape_meta}
    normalizer_num_workers: 0
    quality_filter:
      frequency: ${task.dataset_frequeny}
      timestamp_tolerance: 0.0001
      camera_masks:
        camera0_rgb: fisheye_valid
    pose_repr:
      obs_pose_repr: relative
      action_pose_repr: relative

logging:
  project: pika-nero-pick-place
  mode: offline

# latest is updated every completed epoch; ranked copies remain periodic.
checkpoint:
  topk:
    k: 5
    monitor_key: val_loss
    format_str: 'epoch={epoch:04d}-val_loss={val_loss:.4f}.ckpt'
